[project]
name = "attache-backend"
version = "0.1.0"
description = "Attache - AI chief-of-staff dashboard (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic",
    "pydantic[email]>=2",
    "pydantic-settings",
    "argon2-cffi",
    "python-jose[cryptography]",
    "cryptography",
    "psycopg[binary]",
    "pgvector",
    "anthropic",
    "msal",
    "httpx",
    "apscheduler",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

